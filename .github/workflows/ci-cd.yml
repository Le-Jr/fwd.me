# CI on every PR and push to dev/main; deploy to Vercel only after CI passes.
#   push dev  -> Vercel Preview (staging)
#   push main -> Vercel Production
# Secrets (repo Settings -> Secrets and variables -> Actions):
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
name: CI/CD

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # never cancel a deploy halfway; superseded PR runs can go
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  VERCEL_CLI: "vercel@64.5.0"

jobs:
  ci:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  deploy:
    name: Deploy to Vercel (${{ github.ref_name == 'main' && 'production' || 'preview' }})
    needs: ci
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ENV: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      PROD_FLAG: ${{ github.ref_name == 'main' && '--prod' || '' }}
    steps:
      - name: Check Vercel secrets
        id: secrets
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Vercel secrets missing (VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID); skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Vercel CLI
        if: steps.secrets.outputs.ready == 'true'
        run: npm install --global "$VERCEL_CLI"

      - name: Pull Vercel settings and env vars
        if: steps.secrets.outputs.ready == 'true'
        run: vercel pull --yes --environment="$VERCEL_ENV" --token="$VERCEL_TOKEN"

      - name: Build
        if: steps.secrets.outputs.ready == 'true'
        run: vercel build $PROD_FLAG --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        if: steps.secrets.outputs.ready == 'true'
        run: |
          url=$(vercel deploy --prebuilt $PROD_FLAG --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Deployed to $VERCEL_ENV" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
